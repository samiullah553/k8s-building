kind: Deployment
apiVersion: apps/v1
metadata:
  name: my-app
  labels:
    app=my-app
  namespace: my-app-ns

spec:
  replicas: 2
  selectors:
    matchLabels:
      app=my-app
  template:
    metadata:
      labels:
        app=my-app
      
  spec:
    containers:
    - name: my-app
      image: nginx:latest
      ports:
      - containerPort: 80

kind: Deployment
apiVersion: apps/v1
metadata:
  name: my-app
  namespace: my-app

spec:
  replicas: 2
  selector:
    matchLabels:
        app: my-app
  template:
    metadata:
      labels: 
        app: my-app

    spec:
      containers:
      - name: my-app
        image: samiullah553/my-app:latest
        ports:
          - containerPort: 3000
